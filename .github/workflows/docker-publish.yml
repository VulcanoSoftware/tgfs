name: docker-build-push

on:
  workflow_run:
    workflows: ["Test and Coverage"]
    types:
      - completed
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    strategy:
      matrix:
        include:
          - name: tgfs
            dockerfile: Dockerfile
            repository: xyvran/tgfs
            ghcr_name: tgfs
          - name: tgfs-fe
            dockerfile: Dockerfile.frontend
            repository: xyvran/tgfs-fe
            ghcr_name: tgfs-fe
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        
      - name: Set up Docker
        uses: docker/setup-docker-action@v5
        with:
          daemon-config: |
            {
              "debug": true,
              "features": {
                "containerd-snapshotter": true
              }
            }

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Image names on ghcr.io must be lowercase.
      - name: Prepare GHCR image name
        id: ghcr
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "image=ghcr.io/${owner}/${{ matrix.ghcr_name }}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ matrix.repository }}:latest
            ${{ matrix.repository }}:${{ github.sha }}
            ${{ steps.ghcr.outputs.image }}:latest
            ${{ steps.ghcr.outputs.image }}:${{ github.sha }}
